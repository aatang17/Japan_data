<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>US CPI — Seasonally Adjusted · Plover Analytics</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header class="site-header" data-section="us-prices" data-page="us-cpi-sa"></header>
<script src="assets/nav.js"></script>

<main class="container" data-dataset="cpi-us-sa" data-default-measure="mom" data-default-range="3"
      data-subtitle="CPI-U, seasonally adjusted" data-file-tag="cpi-sa"
      data-agency="U.S. Bureau of Labor Statistics" data-agency-via="" data-country="US">
  <div id="stale-banner"></div>

  <!-- Filled by assets/nav.js from the US Inflation page's `tabs`. -->
  <div class="page-tabs" data-page-tabs></div>

  <div class="metric-card">
    <div class="metric-card-head">
      <h1>US CPI, Seasonally Adjusted</h1>
      <span class="metric-asof" id="page-asof"></span>
      <p class="metric-sub" id="page-sub"><span class="skeleton" style="display:inline-block;width:420px;height:14px"></span></p>
    </div>
    <div class="strip">
      <div class="strip-grid cols-4" id="tiles">
        <div class="strip-cell skeleton" style="min-height:104px"></div>
        <div class="strip-cell skeleton" style="min-height:104px"></div>
        <div class="strip-cell skeleton" style="min-height:104px"></div>
        <div class="strip-cell skeleton" style="min-height:104px"></div>
      </div>
    </div>
    <p class="strip-foot" id="strip-foot"></p>
  </div>

  <section aria-labelledby="h-main">
    <h2 id="h-main">Seasonally Adjusted Inflation, Monthly</h2>
    <div class="chart-panel">
    <div class="controls">
      <label for="measure-select">Measure</label>
      <select id="measure-select" aria-label="Transformation">
        <option value="yoy">Year over Year (%)</option>
        <option value="mom">Month over Month (%)</option>
        <option value="ann3m">3-Month Annualized (%)</option>
        <option value="index">Index Level</option>
      </select>
      <div class="seg" role="group" aria-label="Date range" id="range-seg">
        <button type="button" data-range="1">1Y</button>
        <button type="button" data-range="3">3Y</button>
        <button type="button" data-range="5" aria-pressed="true">5Y</button>
        <button type="button" data-range="10">10Y</button>
        <button type="button" data-range="max">Max</button>
      </div>
      <span class="spacer"></span>
      <button type="button" class="btn" id="main-png">Download PNG</button>
      <button type="button" class="btn" id="main-csv">Download CSV</button>
    </div>
    <div class="chart" id="main-chart"><div class="skeleton" style="width:100%;height:100%"></div></div>
    <p class="source-line" id="main-source"></p>
    <details class="calc" id="main-calc"></details>
    </div>
  </section>

  <section aria-labelledby="h-groups">
    <h2 id="h-groups">Major Expenditure Groups <span class="h2-note" id="groups-note"></span></h2>
    <div class="chart-panel">
    <div class="chart-bars" id="groups-chart"><div class="skeleton" style="width:100%;height:100%"></div></div>
    <p class="source-line" id="groups-source"></p>
    </div>
  </section>

  <section aria-label="Data source and provenance" class="prov">
    <div id="prov-card"></div>
  </section>

</main>

<footer class="site-footer">
  <div class="inner">
    Source: U.S. Bureau of Labor Statistics.
    <a href="methodology.html">Methodology</a>
  </div>
</footer>

<script src="assets/echarts.min.js"></script>
<script src="assets/format.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/ask.js"></script>
<script src="assets/sortable.js"></script>
<script src="assets/overview.js"></script>
</body>
</html>
